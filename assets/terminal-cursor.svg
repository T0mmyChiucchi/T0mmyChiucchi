<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 25" width="13" height="25">
  <style>
    @keyframes blink {
      0%, 49% { opacity: 0.45; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      fill: #c0caf5;
      animation: blink 1s step-end infinite;
    }
  </style>
  <rect class="cursor" x="0" y="0" width="13" height="25" rx="0.5" />
</svg>